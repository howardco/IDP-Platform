services:
  mysql:
    image: mysql:8.0
    container_name: idp-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change-me}
      MYSQL_USER: ${MYSQL_USER:-db_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-db_password}
    volumes:
      - mysql-data:/var/lib/mysql
      - ../IDP-Tools/Docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
      - ../IDP-Tools/Docker/mysql/my.conf:/etc/mysql/conf.d/zzz-idp.cnf:ro
    command: --default-time-zone=+00:00
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-change-me}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - idp

  general-mcp-server:
    build:
      context: ../IDP-GeneralMCPServer
    container_name: idp-general-mcp-server
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      logstash:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 45s
    networks:
      - idp

  yfinance-proxy:
    build:
      context: ../IDP-yFinance-Proxy
    container_name: idp-yfinance-proxy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/docs')"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 15s
    networks:
      - idp

  yahoo-finance-server:
    build:
      context: ..
      dockerfile: IDP-YahooFinanceInfoServer/Dockerfile
    container_name: idp-yahoo-finance-server
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_USERNAME: ${MYSQL_USER:-db_user}
      DB_PASSWORD: ${MYSQL_PASSWORD:-db_password}
    depends_on:
      mysql:
        condition: service_healthy
      yfinance-proxy:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 45s
    networks:
      - idp

  web-search:
    build:
      context: ..
      dockerfile: IDP-WebSearch/Dockerfile
    container_name: idp-web-search
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SERPER_API_KEY: ${SERPER_API_KEY}
      DB_USERNAME: ${MYSQL_USER:-db_user}
      DB_PASSWORD: ${MYSQL_PASSWORD:-db_password}
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 45s
    networks:
      - idp

  strategy-manager:
    build:
      context: ..
      dockerfile: IDP-StrategyManager/Dockerfile
    container_name: idp-strategy-manager
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_USERNAME: ${MYSQL_USER:-db_user}
      DB_PASSWORD: ${MYSQL_PASSWORD:-db_password}
      IDP_ENGINE_URL: http://idp-engine:8080
      SUPERSET_BASE_URL: http://localhost:8088
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8084/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 45s
    ports:
      - "8084:8084"
    networks:
      - idp

  idp-engine:
    build:
      context: ..
      dockerfile: IDP-Engine/Dockerfile
    container_name: idp-engine
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: docker
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      DB_USERNAME: ${MYSQL_USER:-db_user}
      DB_PASSWORD: ${MYSQL_PASSWORD:-db_password}
      STRATEGY_MANAGER_URL: http://strategy-manager:8084
    depends_on:
      mysql:
        condition: service_healthy
      general-mcp-server:
        condition: service_healthy
      yahoo-finance-server:
        condition: service_healthy
      web-search:
        condition: service_healthy
      strategy-manager:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s
    ports:
      - "8090:8080"
    networks:
      - idp

  opensearch:
    image: opensearchproject/opensearch:2.11.0
    container_name: idp-opensearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - plugins.security.disabled=true
      - OPENSEARCH_JAVA_OPTS=-Xms1g -Xmx1g
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -q '\"status\"'"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - idp

  logstash:
    image: opensearchproject/logstash-oss-with-opensearch-output-plugin:8.9.0
    container_name: idp-logstash
    restart: unless-stopped
    volumes:
      - ../IDP-Centralised-Logging/logstash/config/logstash.yml:/usr/share/logstash/config/logstash.yml:ro
      - ../IDP-Centralised-Logging/logstash/pipeline:/usr/share/logstash/pipeline:ro
    environment:
      - LS_JAVA_OPTS=-Xmx1g -Xms1g
    depends_on:
      opensearch:
        condition: service_healthy
    networks:
      - idp

  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:2.11.0
    container_name: idp-opensearch-dashboards
    restart: unless-stopped
    environment:
      - OPENSEARCH_HOSTS=http://opensearch:9200
      - DISABLE_SECURITY_DASHBOARDS_PLUGIN=true
    depends_on:
      opensearch:
        condition: service_healthy
    ports:
      - "5601:5601"
    networks:
      - idp

  superset-db:
    image: postgres:15
    container_name: idp-superset-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${SUPERSET_METADATA_DB:-superset}
      POSTGRES_USER: ${SUPERSET_METADATA_DB_USER:-superset}
      POSTGRES_PASSWORD: ${SUPERSET_METADATA_DB_PASSWORD:-change-me}
    volumes:
      - superset-db-data:/var/lib/postgresql/data
    networks:
      - idp

  superset-redis:
    image: redis:7
    container_name: idp-superset-redis
    restart: unless-stopped
    networks:
      - idp

  superset-init:
    image: apache/superset:6.1.0
    container_name: idp-superset-init
    depends_on:
      - superset-db
      - superset-redis
    environment:
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY:-gQPKOxsV18ZMLvbLjDDTkr+qBamXExgjScMD8bPII9YbfbT9B0YynQME}
      DATABASE_DIALECT: postgresql
      DATABASE_HOST: superset-db
      DATABASE_PORT: "5432"
      DATABASE_DB: ${SUPERSET_METADATA_DB:-superset}
      DATABASE_USER: ${SUPERSET_METADATA_DB_USER:-superset}
      DATABASE_PASSWORD: ${SUPERSET_METADATA_DB_PASSWORD:-change-me}
      REDIS_HOST: superset-redis
      REDIS_PORT: "6379"
      ADMIN_USERNAME: ${SUPERSET_ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${SUPERSET_ADMIN_PASSWORD:-change-me}
      ADMIN_EMAIL: ${SUPERSET_ADMIN_EMAIL:-admin@example.com}
      GUEST_TOKEN_JWT_SECRET: ${GUEST_TOKEN_JWT_SECRET:-change-me-to-a-real-random-key}
      SUPERSET_EMBED_ALLOWED_DOMAINS: ${SUPERSET_EMBED_ALLOWED_DOMAINS:-http://localhost:8084}
    user: root
    entrypoint: /bin/bash
    command: >
      -c "
      apt-get update -qq &&
      apt-get install -y -qq pkg-config default-libmysqlclient-dev build-essential &&
      uv pip install --python /app/.venv/bin/python3 pymysql mysqlclient &&
      superset db upgrade &&
      superset fab create-admin --username $$ADMIN_USERNAME --password $$ADMIN_PASSWORD --firstname Admin --lastname User --email $$ADMIN_EMAIL || true &&
      superset init
      "
    volumes:
      - ../IDP-Tools/Docker/superset2/superset_config.py:/app/pythonpath/superset_config.py:ro
      - superset-home:/app/superset_home
    networks:
      - idp

  superset:
    image: apache/superset:6.1.0
    container_name: idp-superset
    restart: unless-stopped
    depends_on:
      superset-init:
        condition: service_completed_successfully
    environment:
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY:-gQPKOxsV18ZMLvbLjDDTkr+qBamXExgjScMD8bPII9YbfbT9B0YynQME}
      DATABASE_DIALECT: postgresql
      DATABASE_HOST: superset-db
      DATABASE_PORT: "5432"
      DATABASE_DB: ${SUPERSET_METADATA_DB:-superset}
      DATABASE_USER: ${SUPERSET_METADATA_DB_USER:-superset}
      DATABASE_PASSWORD: ${SUPERSET_METADATA_DB_PASSWORD:-change-me}
      REDIS_HOST: superset-redis
      REDIS_PORT: "6379"
      GUEST_TOKEN_JWT_SECRET: ${GUEST_TOKEN_JWT_SECRET:-change-me-to-a-real-random-key}
      SUPERSET_EMBED_ALLOWED_DOMAINS: ${SUPERSET_EMBED_ALLOWED_DOMAINS:-http://localhost:8084}
    ports:
      - "8088:8088"
    volumes:
      - ../IDP-Tools/Docker/superset2/superset_config.py:/app/pythonpath/superset_config.py:ro
      - superset-home:/app/superset_home
    user: root
    entrypoint: /bin/bash
    command: >
      -c "
      apt-get update -qq &&
      apt-get install -y -qq pkg-config default-libmysqlclient-dev build-essential &&
      uv pip install --python /app/.venv/bin/python3 pymysql mysqlclient &&
      /usr/bin/run-server.sh
      "
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8088/health"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s
    networks:
      - idp

  superset-dashboards:
    image: python:3.12-slim
    container_name: idp-superset-dashboards
    depends_on:
      superset:
        condition: service_healthy
      mysql:
        condition: service_healthy
    environment:
      SUPERSET_BASE_URL: http://superset:8088
      SUPERSET_ADMIN_USERNAME: ${SUPERSET_ADMIN_USERNAME:-admin}
      SUPERSET_ADMIN_PASSWORD: ${SUPERSET_ADMIN_PASSWORD:-change-me}
      IDP_ENGINE_MYSQL_HOST: mysql
      IDP_ENGINE_MYSQL_PORT: "3306"
      IDP_ENGINE_MYSQL_USER: ${MYSQL_USER:-db_user}
      IDP_ENGINE_MYSQL_PASSWORD: ${MYSQL_PASSWORD:-db_password}
      IDP_ENGINE_MYSQL_DB: idp_engine
      SUPERSET_EMBED_ALLOWED_DOMAINS: ${SUPERSET_EMBED_ALLOWED_DOMAINS:-http://localhost:8084}
    volumes:
      - ../IDP-Tools/Docker/superset2/build_dashboard.py:/build_dashboard.py:ro
    # build_dashboard.py is stdlib-only (no pip install needed) and idempotent -
    # safe to run on every `docker compose up`, including restarts where the
    # dashboards/embedded config already exist.
    command: ["python", "-I", "/build_dashboard.py"]
    networks:
      - idp

networks:
  idp:
    driver: bridge

volumes:
  mysql-data:
  opensearch-data:
  superset-db-data:
  superset-home:
